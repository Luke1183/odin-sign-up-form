<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Sign-up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="left-image">
        <div id="logo-container">
            <div id="logo"></div>
            <h1 id="logo-text">ODIN</h1>
        </div>
        <div id="image-credit">Photo by <a href="">Hailie West</a> on <a href="">Unsplash</a></div>
    </div>
    <div id="right-content">
        <div id="text-container">
            <p><strong>This is not a real online service! You know you need something like this in
                your life to help you realize your deepest dreams. Sign up <em>now</em> to
                get started.</p>
            <p>You <em>know</em> you want to.</strong></p>
        </div>
        <div id="form-container">
            <form action="" id="create-account">
                <fieldset>
                    <legend>Let's do this!</legend>
                    <label for="firstname">FIRST NAME</label>
                    <input type="text" name="firstname" id="firstname">

                    <label for="lastname">LAST NAME</label>
                    <input type="text" name="lastname" id="lastname">

                    <label for="email">EMAIL</label>
                    <input type="email" name="email" id="email">

                    <label for="phonenumber">PHONE NUMBER</label>
                    <input type="tel" name="phonenumber" id="phonenumber">

                    <label for="password">PASSWORD</label>
                    <input type="password" name="password" id="password">

                    <label for="confirmpassword">CONFIRM PASSWORD</label>
                    <input type="password" name="confirmpassword" id="confirmpassword">
                </fieldset>
            </form>
        </div>
        <div id="submit-button-container">
            <button id="submit-button" type="submit" form="create-account">Create Account</button>
        </div>
        <div id="log-in-link-container">
            <p>Already have an account? <a href="#">Log in</a></p>
        </div>
    </div>
</body>
</html>
